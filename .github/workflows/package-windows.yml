name: package-windows

# Builds a signed-less Inno Setup installer (Zed-x86_64.exe) for the fork.
# Dispatch-only on purpose: a full bundling run takes ~90-120 minutes.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel baked into the binary and installer
        type: choice
        options:
          - stable
          - preview
          - nightly
          - dev
        default: stable

permissions:
  # `write` is only used to push the bundling log to `ci-package-log` when the
  # installer build fails.
  contents: write

concurrency:
  group: package-windows
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      CI: "true"
      ZED_WORKSPACE: ${{ github.workspace }}
      # Consumed by script/bundle-windows.ps1 (patched to honor these) and by
      # the release_channel / windows_resources build scripts.
      ZED_RELEASE_CHANNEL: ${{ inputs.channel }}
      RELEASE_CHANNEL: ${{ inputs.channel }}
      # Compile-time switch that stops a non-dev channel from polling zed.dev
      # and replacing this self-built binary with the official release.
      ZED_UPDATE_EXPLANATION: "Self-built from a fork; rebuild it locally to update."
      # Optional: set both secrets to sign the installer with a self-signed
      # certificate (see script/signing/create-self-signed-cert.ps1).
      SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
      SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022" -Directory | Select-Object -ExpandProperty Name
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
          Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

      - name: Install Spectre-mitigated VC runtimes
        continue-on-error: true
        shell: pwsh
        run: |
          $vs = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\2022" -Directory |
            Where-Object { Test-Path "$($_.FullName)\Common7\Tools\Launch-VsDevShell.ps1" } |
            Select-Object -First 1
          $installer = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"
          Start-Process -FilePath $installer -Wait -NoNewWindow -ArgumentList @(
            "modify",
            "--installPath", $vs.FullName,
            "--add", "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre",
            "--quiet", "--norestart", "--nocache"
          )

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2
        with:
          # Must match build-windows so the installer build reuses the target
          # directory it already produced. Only valid for the `stable` channel,
          # since the channel is baked into build scripts.
          shared-key: windows-x86_64-release
          cache-targets: true

      - name: Determine release version
        shell: pwsh
        run: |
          $version = (Select-String -Path crates/zed/Cargo.toml -Pattern '^version = "(.*)"' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      # Builds zed, cli, auto_update_helper, explorer_command_injector and
      # remote_server, then runs Inno Setup. Signing is skipped automatically
      # because the Azure signing secrets are absent on a fork.
      - name: Bundle
        shell: pwsh
        run: |
          & ./script/bundle-windows.ps1 *> bundle.log
          $code = $LASTEXITCODE
          if ($null -eq $code) { $code = 0 }
          Get-Content bundle.log -Tail 200
          if ($code -ne 0) { exit $code }

      - name: Publish bundling log on failure
        if: failure()
        continue-on-error: true
        shell: pwsh
        run: |
          if (-not (Test-Path bundle.log)) { exit 0 }
          $lines = Get-Content bundle.log -Tail 1200
          Set-Content -Path bundle.log -Value $lines
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -B ci-package-log
          git add -f bundle.log
          git commit -m "ci: bundling log for $env:GITHUB_SHA"
          git push -f origin ci-package-log

      - name: Sign installer
        if: env.SIGNING_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          $password = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password

          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found in the Windows SDK" }

          $installer = "target/Zed-x86_64.exe"
          & $signtool.FullName sign /sha1 $cert.Thumbprint /fd sha256 /tr http://timestamp.digicert.com /td sha256 $installer
          if ($LASTEXITCODE -ne 0) { throw "signtool sign failed with exit code $LASTEXITCODE" }
          & $signtool.FullName verify /pa $installer
          if ($LASTEXITCODE -ne 0) { throw "signtool verify failed" }

          Remove-Item $pfxPath -Force

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: zed-windows-installer-${{ inputs.channel }}
          path: target/Zed-x86_64.exe
          if-no-files-found: error
          retention-days: 14
