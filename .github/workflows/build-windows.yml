name: build-windows

# Fork-local Windows build. Upstream's Windows jobs only run on the
# `self-32vcpu-windows-2022` self-hosted runner behind an owner gate, which a
# fork cannot use. This runs on the GitHub-hosted windows-2022 image, which
# already ships VS 2022 (C++ desktop workload), the Windows SDK and CMake.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/workflows/**"
      - "script/**"

permissions:
  # `write` is only used to push the build log to the `ci-build-log` branch
  # when a build fails, so the failure can be diagnosed without download
  # access to Actions logs.
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x86_64:
    runs-on: windows-2022
    timeout-minutes: 300
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      # Keep these identical to package-windows so both workflows share one
      # cargo target cache: the channel is baked into build scripts, and a
      # different value invalidates most of the dependency graph.
      ZED_RELEASE_CHANNEL: stable
      RELEASE_CHANNEL: stable
      ZED_UPDATE_EXPLANATION: "Self-built from a fork; rebuild it locally to update."
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          cmake --version
          rustup target add x86_64-pc-windows-msvc
          (Get-PSDrive C).Free / 1GB

      # docs/src/development/windows.md lists the Spectre-mitigated VC runtimes
      # as required. The hosted image does not include them.
      - name: Install Spectre-mitigated VC runtimes
        continue-on-error: true
        shell: pwsh
        run: |
          $vs = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          $installer = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"
          Start-Process -FilePath $installer -Wait -NoNewWindow -ArgumentList @(
            "modify",
            "--installPath", $vs,
            "--add", "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre",
            "--quiet", "--norestart", "--nocache"
          )

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-x86_64-release
          cache-targets: true

      - name: Build zed and cli
        shell: pwsh
        run: |
          # Same target triple and profile as package-windows so the cargo
          # target directory (and therefore the cache) is shared.
          cargo build --release --package zed --package cli --target x86_64-pc-windows-msvc 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish build log on failure
        if: failure()
        continue-on-error: true
        shell: pwsh
        run: |
          if (-not (Test-Path build.log)) { exit 0 }
          $lines = Get-Content build.log -Tail 1200
          Set-Content -Path build.log -Value $lines
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -B ci-build-log
          git add -f build.log
          git commit -m "ci: build log for $env:GITHUB_SHA"
          git push -f origin ci-build-log

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/bin | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/zed.exe out/Zed.exe
          Copy-Item target/x86_64-pc-windows-msvc/release/cli.exe out/bin/zed.exe
          Compress-Archive -Path out/* -DestinationPath zed-dev-windows-x86_64.zip -Force
          (Get-Item zed-dev-windows-x86_64.zip).Length / 1MB

      - uses: actions/upload-artifact@v4
        with:
          name: zed-dev-windows-x86_64
          path: zed-dev-windows-x86_64.zip
          retention-days: 14
